<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Пульс команды — Команда</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --blue:#4f7df5;
    --blue-soft:#eef2ff;
    --background:#eef1f8;
    --card:#ffffff;
    --foreground:#152033;
    --muted-foreground:#7c8698;
    --navy:#10243e;
    --mint:#3f9d81;
    --mint-soft:#e6f6f0;
    --coral:#e35f3f;
    --coral-soft:#fde9e2;
    --violet:#7c5fc4;
    --violet-soft:#efe9fb;
    --shadow: 0 2px 10px rgba(16,36,62,.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--background);
    color:var(--foreground);
    padding:20px 16px 90px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:420px;margin:0 auto;}
  header{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
  .logo{
    width:40px;height:40px;border-radius:12px;overflow:hidden;flex:0 0 auto;
    box-shadow:var(--shadow);
  }
  .logo img{width:100%;height:100%;object-fit:cover;display:block;}
  header h1{font-size:20px;margin:0;font-weight:700;}
  header small{color:var(--muted-foreground);display:block;font-size:14px;margin-top:2px;}

  .hero{
    background:linear-gradient(135deg,#5b86ff 0%,#3a5fe0 55%,#2f49c9 100%);color:#fff;
    border-radius:22px;padding:24px 22px;margin-bottom:28px;
    box-shadow:0 12px 30px rgba(58,95,224,.38);
    display:flex;justify-content:space-between;align-items:center;
  }
  .hero .stat .value{font-size:32px;font-weight:800;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.18);}
  .hero .stat .label{font-size:13px;color:#eaf0ff;font-weight:600;margin-top:4px;}

  .section-title{
    font-size:13px;font-weight:700;color:var(--muted-foreground);
    margin:0 2px 14px;text-transform:uppercase;letter-spacing:.06em;
  }

  .branch{margin-bottom:14px;}
  .member{
    background:var(--card);border-radius:16px;padding:14px;margin-bottom:8px;
    display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);
  }
  .children{margin-left:26px;padding-left:14px;border-left:2px dashed #d7ddec;margin-top:8px;}
  .avatar{
    width:44px;height:44px;border-radius:50%;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff;
  }
  .member .info{flex:1;min-width:0;}
  .member .name{font-weight:700;font-size:15px;}
  .role-pill{
    display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;margin-top:4px;
  }
  .role-owner{background:var(--coral-soft);color:var(--coral);}
  .role-admin{background:var(--violet-soft);color:var(--violet);}
  .role-coordinator{background:var(--mint-soft);color:var(--mint);}
  .role-participant{background:var(--blue-soft);color:var(--blue);}
  .group-tag{color:var(--muted-foreground);font-size:12px;margin-left:6px;}

  .empty{
    background:var(--card);border-radius:16px;padding:16px;text-align:center;
    color:var(--muted-foreground);font-size:13px;box-shadow:var(--shadow);
  }

  nav{
    position:fixed;bottom:14px;left:16px;right:16px;background:#fff;border-radius:18px;
    display:flex;justify-content:space-around;padding:10px 4px;max-width:388px;margin:0 auto;
    box-shadow:0 8px 24px rgba(16,36,62,.14);
  }
  nav a{
    font-size:10.5px;font-weight:600;color:var(--muted-foreground);text-align:center;
    padding:8px 3px;border-radius:12px;flex:1;text-decoration:none;
  }
  nav a.active{color:#fff;background:var(--blue);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><img src="logo.jpg" alt="Пульс команды"></div>
    <div>
      <h1>Пульс команды</h1>
      <small>Команда</small>
    </div>
  </header>

  <div class="hero">
    <div class="stat">
      <div class="value" id="total-count">—</div>
      <div class="label">участников</div>
    </div>
    <div class="stat">
      <div class="value" id="group-count">—</div>
      <div class="label">групп</div>
    </div>
  </div>

  <div class="section-title">Структура наставничества</div>
  <div id="tree"></div>
</div>

<nav>
  <a href="today.html">Сегодня</a>
  <a href="calendar.html">Календарь</a>
  <a href="team.html" class="active">Команда</a>
  <a href="settings.html">Настройки</a>
  <a href="manage.html">Управление</a>
</nav>

<script>
const GROUPS = ['Новички', 'Партнёры', 'Мастера', 'Ключевые'];
const ROLE_LABEL = {
  owner: 'Владелец',
  admin: 'Админ',
  coordinator: 'Координатор',
  participant: 'Участник',
};
const ROLE_CLASS = {
  owner: 'role-owner',
  admin: 'role-admin',
  coordinator: 'role-coordinator',
  participant: 'role-participant',
};
const AVATAR_COLORS = ['#4f7df5','#3f9d81','#e35f3f','#7c5fc4','#c9962e'];

function initials(name){
  return (name || '?').trim().slice(0,1).toUpperCase();
}
function colorFor(name){
  let h = 0;
  for(const ch of (name||'')) h += ch.charCodeAt(0);
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}

function memberHtml(m){
  const avatarUrl = `https://pulskomandy.duckdns.org/api/avatar/${m.telegram_id}`;
  return `
    <div class="member">
      <div class="avatar" style="background:${colorFor(m.name)};">${initials(m.name)}</div>
      <img src="${avatarUrl}" style="display:none;" onload="this.previousElementSibling.style.backgroundImage='url('+this.src+')';this.previousElementSibling.style.backgroundSize='cover';this.previousElementSibling.style.backgroundPosition='center';this.previousElementSibling.textContent='';" onerror="this.remove()">
      <div class="info">
        <div class="name">${m.name || 'Без имени'}</div>
        <span class="role-pill ${ROLE_CLASS[m.role] || 'role-participant'}">${ROLE_LABEL[m.role] || m.role}</span>
        <span class="group-tag">${m.group_name || 'без группы'}</span>
      </div>
    </div>
  `;
}

function renderBranch(member, byMentor){
  const kids = byMentor[member.telegram_id] || [];
  let html = `<div class="branch">${memberHtml(member)}`;
  if(kids.length){
    html += `<div class="children">${kids.map(k => renderBranch(k, byMentor)).join('')}</div>`;
  }
  html += `</div>`;
  return html;
}

const tg = window.Telegram && window.Telegram.WebApp;
if(tg) tg.ready();
const initData = (tg && tg.initData) || localStorage.getItem('tg_init_data') || '';

if(!initData){
  document.getElementById('tree').innerHTML =
    '<div class="empty">Открой это через кнопку в Telegram-боте — вне Telegram список команды не показывается.</div>';
} else {
  fetch('https://pulskomandy.duckdns.org/api/team?initData=' + encodeURIComponent(initData), {cache:'no-store'})
    .then(r => {
      if(!r.ok) throw new Error('unauthorized');
      return r.json();
    })
    .then(members => {
      document.getElementById('total-count').textContent = members.length;
      document.getElementById('group-count').textContent = GROUPS.length;

      const ids = new Set(members.map(m => m.telegram_id));
      const byMentor = {};
      members.forEach(m => {
        const key = ids.has(m.mentor_id) ? m.mentor_id : 'root';
        (byMentor[key] = byMentor[key] || []).push(m);
      });
      const roots = byMentor['root'] || [];

      const tree = document.getElementById('tree');
      tree.innerHTML = roots.length
        ? roots.map(m => renderBranch(m, byMentor)).join('')
        : '<div class="empty">Пока никого нет</div>';
    })
    .catch(() => {
      document.getElementById('tree').innerHTML = '<div class="empty">Не удалось загрузить команду</div>';
    });
}
</script>
</body>
</html>
