<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Пульс команды — Сегодня</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --blue:#4f7df5;
    --blue-soft:#eef2ff;
    --background:#eef1f8;
    --card:#ffffff;
    --border:#e4e8ed;
    --foreground:#152033;
    --muted-foreground:#7c8698;
    --navy:#10243e;
    --mint:#3f9d81;
    --mint-soft:#e6f6f0;
    --coral:#e35f3f;
    --coral-soft:#fde9e2;
    --violet:#7c5fc4;
    --violet-soft:#efe9fb;
    --shadow: 0 2px 10px rgba(16,36,62,.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--background);
    color:var(--foreground);
    padding:20px 16px 90px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:420px;margin:0 auto;}
  header{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
  .logo{
    width:40px;height:40px;border-radius:12px;background:var(--blue);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;
    box-shadow:var(--shadow);
  }
  header h1{font-size:20px;margin:0;font-weight:700;}
  header small{color:var(--muted-foreground);display:block;font-size:14px;margin-top:2px;}

  .hero{
    background:var(--navy);
    color:#fff;
    border-radius:22px;
    padding:24px 22px;
    margin-bottom:28px;
    box-shadow:0 8px 24px rgba(16,36,62,.18);
  }
  .hero .label{font-size:14px;opacity:.65;margin-bottom:8px;letter-spacing:.02em;}
  .hero .value{font-size:44px;font-weight:800;line-height:1;}
  .hero .sub{font-size:14px;opacity:.75;margin-top:10px;line-height:1.4;}

  .section-title{
    font-size:13px;font-weight:700;color:var(--muted-foreground);
    margin:0 2px 14px;text-transform:uppercase;letter-spacing:.06em;
  }

  .card-wrap{
    background:var(--card);
    border-radius:18px;
    margin-bottom:14px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .card{
    padding:16px;
    display:flex;
    gap:14px;
    align-items:center;
    cursor:pointer;
  }
  .details{
    display:none;
    padding:0 16px 16px;
    border-top:1px solid #f0f2f7;
  }
  .details.open{display:block;padding-top:14px;}
  .details img{width:100%;border-radius:12px;margin-bottom:12px;}
  .details .row{font-size:14px;margin-bottom:8px;color:var(--foreground);}
  .details .row b{color:var(--muted-foreground);font-weight:600;}
  .details a{color:var(--blue);word-break:break-all;}
  .badge{
    width:50px;height:50px;border-radius:14px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-size:22px;
  }
  .b-club{background:var(--blue-soft);color:var(--blue);}
  .b-study{background:var(--mint-soft);color:var(--mint);}
  .b-live{background:var(--coral-soft);color:var(--coral);}
  .b-default{background:var(--violet-soft);color:var(--violet);}

  .card .info{flex:1;min-width:0;}
  .card .title{
    font-weight:700;font-size:16px;line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .card .meta{
    font-size:13px;color:var(--muted-foreground);margin-top:4px;
  }
  .card .cat-pill{
    display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;
    border-radius:20px;margin-top:7px;
  }
  .cat-club{background:var(--blue-soft);color:var(--blue);}
  .cat-study{background:var(--mint-soft);color:var(--mint);}
  .cat-live{background:var(--coral-soft);color:var(--coral);}
  .cat-default{background:var(--violet-soft);color:var(--violet);}

  .rsvp{flex:0 0 auto;}
  .rsvp button{
    border:none;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;
    background:var(--blue-soft);color:var(--blue);transition:background .15s,color .15s;
  }
  .rsvp button.going{background:var(--blue);color:#fff;}

  nav{
    position:fixed;bottom:14px;left:16px;right:16px;
    background:#fff;border-radius:18px;
    display:flex;justify-content:space-around;padding:10px 4px;
    max-width:388px;margin:0 auto;
    box-shadow:0 8px 24px rgba(16,36,62,.14);
  }
  nav a{
    font-size:10.5px;font-weight:600;color:var(--muted-foreground);text-align:center;
    padding:8px 3px;border-radius:12px;flex:1;text-decoration:none;
  }
  nav a.active{color:var(--blue);background:var(--blue-soft);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">П</div>
    <div>
      <h1>Пульс команды</h1>
      <small>Ближайшие события</small>
    </div>
  </header>

  <div class="hero">
    <div class="label">Событий впереди</div>
    <div class="value" id="hero-count">—</div>
    <div class="sub" id="hero-sub">загрузка…</div>
  </div>

  <div class="section-title">Ближайшие</div>
  <div id="list"></div>
</div>

<nav>
  <a href="today.html" class="active">Сегодня</a>
  <a href="calendar.html">Календарь</a>
  <a href="team.html">Команда</a>
  <a href="settings.html">Настройки</a>
  <a href="manage.html">Управление</a>
</nav>

<script>
const CATEGORY_ICON = {
  'клуб 100': {cls:'b-club', cat:'cat-club', icon:'💯'},
  'обучение': {cls:'b-study', cat:'cat-study', icon:'🎓'},
  'эфир/марафон': {cls:'b-live', cat:'cat-live', icon:'🔴'},
  'планёрка': {cls:'b-default', cat:'cat-default', icon:'🗓'},
  'акция': {cls:'b-default', cat:'cat-default', icon:'🎉'},
  'дедлайн': {cls:'b-default', cat:'cat-default', icon:'⏰'},
};

function fmtDate(dtStr){
  const [datePart, timePart] = dtStr.split(' ');
  const [y,m,d] = datePart.split('-');
  return `${d}.${m} · ${timePart}`;
}

const tg = window.Telegram && window.Telegram.WebApp;
if(tg){
  tg.ready();
  if(tg.initData) localStorage.setItem('tg_init_data', tg.initData);
}

async function load(){
  let events = [];
  try{
    const res = await fetch('https://pulskomandy.duckdns.org/api/events', {cache:'no-store'});
    events = await res.json();
  }catch(e){
    document.getElementById('hero-sub').textContent = 'нет данных';
    return;
  }
  document.getElementById('hero-count').textContent = events.length;
  document.getElementById('hero-sub').textContent = events.length
    ? `Ближайшее — ${events[0].title}, ${fmtDate(events[0].event_dt)}`
    : 'Событий не найдено';

  const list = document.getElementById('list');
  list.innerHTML = '';
  events.forEach(ev => {
    const meta = CATEGORY_ICON[ev.category] || CATEGORY_ICON['планёрка'];
    const wrap = document.createElement('div');
    wrap.className = 'card-wrap';
    const badgeHtml = ev.image_url
      ? `<img src="${ev.image_url}" style="width:50px;height:50px;border-radius:14px;object-fit:cover;flex:0 0 auto;">`
      : `<div class="badge ${meta.cls}">${meta.icon}</div>`;
    const detailRows = [];
    if(ev.description) detailRows.push(`<div class="row"><b>Описание:</b> ${ev.description}</div>`);
    if(ev.link) detailRows.push(`<div class="row"><b>Ссылка:</b> <a href="${ev.link}" target="_blank">${ev.link}</a></div>`);
    if(ev.responsible) detailRows.push(`<div class="row"><b>Ответственный:</b> ${ev.responsible}</div>`);
    detailRows.push(`<div class="row"><b>Группа:</b> ${ev.group_name === 'all' ? 'все' : ev.group_name}</div>`);
    wrap.innerHTML = `
      <div class="card">
        ${badgeHtml}
        <div class="info">
          <div class="title">${ev.title}</div>
          <div class="meta">${fmtDate(ev.event_dt)}</div>
          <span class="cat-pill ${meta.cat}">${ev.category || ''}</span>
        </div>
        <div class="rsvp">
          <button data-id="${ev.id}">Буду</button>
        </div>
      </div>
      <div class="details">
        ${ev.image_url ? `<img src="${ev.image_url}">` : ''}
        ${detailRows.join('')}
      </div>
    `;
    wrap.querySelector('.card').addEventListener('click', (e) => {
      if(e.target.closest('.rsvp')) return;
      wrap.querySelector('.details').classList.toggle('open');
    });
    list.appendChild(wrap);
  });

  document.querySelectorAll('.rsvp button').forEach(btn => {
    const key = 'rsvp_' + btn.dataset.id;
    if(localStorage.getItem(key) === '1'){
      btn.classList.add('going');
      btn.textContent = 'Иду ✓';
    }
    btn.addEventListener('click', () => {
      const going = btn.classList.toggle('going');
      btn.textContent = going ? 'Иду ✓' : 'Буду';
      localStorage.setItem(key, going ? '1' : '0');
    });
  });
}
load();
</script>
</body>
</html>
