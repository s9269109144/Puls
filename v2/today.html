<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Пульс команды — Сегодня</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --blue:#4f7df5;
    --blue-soft:#eef2ff;
    --background:#eef1f8;
    --card:#ffffff;
    --border:#e4e8ed;
    --foreground:#152033;
    --muted-foreground:#7c8698;
    --navy:#10243e;
    --mint:#3f9d81;
    --mint-soft:#e6f6f0;
    --coral:#e35f3f;
    --coral-soft:#fde9e2;
    --violet:#7c5fc4;
    --violet-soft:#efe9fb;
    --amber:#b9791b;
    --amber-soft:#fcefd7;
    --shadow: 0 2px 10px rgba(16,36,62,.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--background);
    color:var(--foreground);
    padding:20px 16px 90px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:420px;margin:0 auto;}
  header{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
  .logo{
    width:40px;height:40px;border-radius:12px;overflow:hidden;flex:0 0 auto;
    box-shadow:var(--shadow);
  }
  .logo img{width:100%;height:100%;object-fit:cover;display:block;}
  header h1{font-size:20px;margin:0;font-weight:700;}
  header small{color:var(--muted-foreground);display:block;font-size:14px;margin-top:2px;}

  .hero{
    background:linear-gradient(135deg,#5b86ff 0%,#3a5fe0 55%,#2f49c9 100%);
    color:#fff;
    border-radius:22px;
    padding:24px 22px;
    margin-bottom:28px;
    box-shadow:0 12px 30px rgba(58,95,224,.38);
  }
  .hero .label{
    font-size:13px;font-weight:700;margin-bottom:10px;
    text-transform:uppercase;letter-spacing:.08em;color:#eaf0ff;
  }
  .hero .value{font-size:48px;font-weight:800;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.18);}
  .hero .sub{font-size:14px;color:#fff;margin-top:14px;line-height:1.5;}
  .hero .sub .hero-day{font-weight:700;margin-bottom:8px;color:#eaf0ff;}
  .hero .sub .hero-item{
    display:flex;gap:10px;align-items:baseline;
    font-size:14.5px;font-weight:600;line-height:1.7;
  }
  .hero .sub .hero-time{
    font-weight:800;flex:0 0 auto;min-width:46px;
    background:rgba(255,255,255,.18);border-radius:7px;
    padding:1px 7px;text-align:center;font-size:13px;
  }

  .section-title{
    font-size:13px;font-weight:700;color:var(--muted-foreground);
    margin:0 2px 14px;text-transform:uppercase;letter-spacing:.06em;
  }

  .card-wrap{
    background:var(--card);
    border-radius:18px;
    margin-bottom:14px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .card{
    padding:16px;
    display:flex;
    gap:14px;
    align-items:center;
    cursor:pointer;
  }
  .details{
    display:none;
    padding:0 16px 16px;
    border-top:1px solid #f0f2f7;
  }
  .details.open{display:block;padding-top:14px;}
  .details img{width:100%;border-radius:12px;margin-bottom:12px;}
  .details .row{font-size:14px;margin-bottom:8px;color:var(--foreground);white-space:pre-line;line-height:1.5;}
  .details .row b{color:var(--muted-foreground);font-weight:600;}
  .details a{color:var(--blue);word-break:break-all;}
  .badge{
    width:50px;height:50px;border-radius:14px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-size:22px;
  }
  .b-club{background:var(--blue-soft);color:var(--blue);}
  .b-study{background:var(--mint-soft);color:var(--mint);}
  .b-live{background:var(--coral-soft);color:var(--coral);}
  .b-default{background:var(--violet-soft);color:var(--violet);}
  .b-event{background:var(--amber-soft);color:var(--amber);}

  .card .info{flex:1;min-width:0;}
  .card .title{
    font-weight:700;font-size:16px;line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .card .meta{
    font-size:13px;color:var(--muted-foreground);margin-top:4px;
  }
  .card .cat-pill{
    display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;
    border-radius:20px;margin-top:7px;
  }
  .cat-club{background:var(--blue-soft);color:var(--blue);}
  .cat-study{background:var(--mint-soft);color:var(--mint);}
  .cat-live{background:var(--coral-soft);color:var(--coral);}
  .cat-default{background:var(--violet-soft);color:var(--violet);}
  .cat-event{background:var(--amber-soft);color:var(--amber);}

  .rsvp{flex:0 0 auto;}
  .rsvp button{
    border:none;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;
    background:var(--blue-soft);color:var(--blue);transition:background .15s,color .15s;
  }
  .rsvp button.going{background:var(--blue);color:#fff;}

  nav{
    position:fixed;bottom:14px;left:16px;right:16px;
    background:#fff;border-radius:18px;
    display:flex;justify-content:space-around;padding:10px 4px;
    max-width:388px;margin:0 auto;
    box-shadow:0 8px 24px rgba(16,36,62,.14);
  }
  nav a{
    font-size:10.5px;font-weight:600;color:var(--muted-foreground);text-align:center;
    padding:8px 3px;border-radius:12px;flex:1;text-decoration:none;
  }
  nav a.active{color:var(--blue);background:var(--blue-soft);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><img src="logo.jpg" alt="Пульс команды"></div>
    <div>
      <h1>Пульс команды</h1>
      <small>Ближайшие события</small>
    </div>
  </header>

  <div class="hero">
    <div class="label">Предстоящие события</div>
    <div class="value" id="hero-count">—</div>
    <div class="sub" id="hero-sub">загрузка…</div>
  </div>

  <div class="section-title">Ближайшие</div>
  <div id="list"></div>
</div>

<nav>
  <a href="today.html" class="active">Сегодня</a>
  <a href="calendar.html">Календарь</a>
  <a href="team.html">Команда</a>
  <a href="settings.html">Настройки</a>
  <a href="manage.html">Управление</a>
</nav>

<script>
const CATEGORY_ICON = {
  'клуб 100': {cls:'b-club', cat:'cat-club', icon:'💯'},
  'обучение': {cls:'b-study', cat:'cat-study', icon:'🎓'},
  'эфир/марафон': {cls:'b-live', cat:'cat-live', icon:'🔴'},
  'планёрка': {cls:'b-default', cat:'cat-default', icon:'🗓'},
  'акция': {cls:'b-default', cat:'cat-default', icon:'🎉'},
  'дедлайн': {cls:'b-default', cat:'cat-default', icon:'⏰'},
  'мероприятие': {cls:'b-event', cat:'cat-event', icon:'🌍'},
};

function metaLine(ev){
  const startDate = ev.event_dt.split(' ')[0];
  const [, sm, sd] = startDate.split('-');
  const end = ev.event_end ? ev.event_end.slice(0,10) : '';
  if(end && end !== startDate){
    const [, em, ed] = end.split('-');
    const tail = ev.category === 'мероприятие' ? ' · весь день' : '';
    return `${sd}.${sm} – ${ed}.${em}${tail}`;
  }
  if(ev.category === 'мероприятие'){
    return `${sd}.${sm} · весь день`;
  }
  return fmtDate(ev.event_dt);
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function formatText(s){
  return escapeHtml(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}

function fmtDate(dtStr){
  const [datePart, timePart] = dtStr.split(' ');
  const [y,m,d] = datePart.split('-');
  return `${d}.${m} · ${timePart}`;
}

const tg = window.Telegram && window.Telegram.WebApp;
if(tg){
  tg.ready();
  if(tg.initData) localStorage.setItem('tg_init_data', tg.initData);
}
const initData = (tg && tg.initData) || localStorage.getItem('tg_init_data') || '';

async function load(){
  let events = [];
  try{
    const url = 'https://pulskomandy.duckdns.org/api/events' + (initData ? '?initData=' + encodeURIComponent(initData) : '');
    const res = await fetch(url, {cache:'no-store'});
    events = await res.json();
  }catch(e){
    document.getElementById('hero-sub').textContent = 'нет данных';
    return;
  }
  document.getElementById('hero-count').textContent = events.length;
  const subEl = document.getElementById('hero-sub');
  if(!events.length){
    subEl.textContent = 'Событий не найдено';
  } else {
    const firstDate = events[0].event_dt.split(' ')[0];
    const sameDay = events.filter(e => e.event_dt.split(' ')[0] === firstDate);
    const [yy,mm,dd] = firstDate.split('-');
    if(sameDay.length === 1){
      subEl.innerHTML = `Ближайшее — ${escapeHtml(sameDay[0].title)}, ${fmtDate(sameDay[0].event_dt)}`;
    } else {
      const items = sameDay.map(e =>
        `<div class="hero-item"><span class="hero-time">${e.event_dt.split(' ')[1]}</span><span>${escapeHtml(e.title)}</span></div>`
      ).join('');
      subEl.innerHTML = `<div class="hero-day">Ближайшее — ${dd}.${mm}</div>${items}`;
    }
  }

  function renderCard(ev){
    const meta = CATEGORY_ICON[ev.category] || CATEGORY_ICON['планёрка'];
    const wrap = document.createElement('div');
    wrap.className = 'card-wrap';
    const badgeHtml = ev.image_url
      ? `<div class="badge ${meta.cls}" style="position:relative;overflow:hidden;padding:0;">
           <span>${meta.icon}</span>
           <img src="${ev.image_url}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" onerror="this.remove()">
         </div>`
      : `<div class="badge ${meta.cls}">${meta.icon}</div>`;
    const detailRows = [];
    if(ev.description) detailRows.push(`<div class="row"><b>Описание:</b><br>${formatText(ev.description)}</div>`);
    if(ev.link) detailRows.push(`<div class="row"><b>Ссылка:</b> <a href="${ev.link}" target="_blank">${ev.link}</a></div>`);
    if(ev.responsible) detailRows.push(`<div class="row"><b>Ответственный:</b> ${ev.responsible}</div>`);
    detailRows.push(`<div class="row"><b>Группа:</b> ${ev.group_name === 'all' ? 'все' : ev.group_name}</div>`);
    wrap.innerHTML = `
      <div class="card">
        ${badgeHtml}
        <div class="info">
          <div class="title">${ev.title}</div>
          <div class="meta">${metaLine(ev)}</div>
          <span class="cat-pill ${meta.cat}">${ev.category || ''}</span>
        </div>
        <div class="rsvp">
          <button data-id="${ev.id}" data-status="${ev.my_status || ''}">Буду</button>
        </div>
      </div>
      <div class="details">
        ${ev.image_url ? `<img src="${ev.image_url}" onerror="this.remove()">` : ''}
        ${detailRows.join('')}
      </div>
    `;
    wrap.querySelector('.card').addEventListener('click', (e) => {
      if(e.target.closest('.rsvp')) return;
      wrap.querySelector('.details').classList.toggle('open');
    });
    return wrap;
  }

  const ordered = [...events].sort((a, b) =>
    a.event_dt < b.event_dt ? -1 : a.event_dt > b.event_dt ? 1 : 0
  );

  const list = document.getElementById('list');
  list.innerHTML = '';
  ordered.forEach(ev => list.appendChild(renderCard(ev)));

  document.querySelectorAll('.rsvp button').forEach(btn => {
    if(btn.dataset.status === 'yes'){
      btn.classList.add('going');
      btn.textContent = 'Иду ✓';
    }
    btn.addEventListener('click', async () => {
      if(!initData){
        alert('Открой это через кнопку в Telegram-боте, чтобы отметить участие.');
        return;
      }
      const going = !btn.classList.contains('going');
      btn.disabled = true;
      try{
        const res = await fetch('https://pulskomandy.duckdns.org/api/rsvp', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({initData, event_id: Number(btn.dataset.id), status: going ? 'yes' : 'no'})
        });
        if(res.ok){
          btn.classList.toggle('going', going);
          btn.textContent = going ? 'Иду ✓' : 'Буду';
        } else {
          alert('Не получилось отправить, попробуй ещё раз');
        }
      } finally {
        btn.disabled = false;
      }
    });
  });
}
load();
</script>
</body>
</html>
