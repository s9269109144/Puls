<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Пульс команды — Управление</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --blue:#4f7df5;
    --blue-soft:#eef2ff;
    --background:#eef1f8;
    --card:#ffffff;
    --foreground:#152033;
    --muted-foreground:#7c8698;
    --navy:#10243e;
    --mint:#3f9d81;
    --mint-soft:#e6f6f0;
    --coral:#e35f3f;
    --coral-soft:#fde9e2;
    --violet:#7c5fc4;
    --violet-soft:#efe9fb;
    --shadow: 0 2px 10px rgba(16,36,62,.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--background);
    color:var(--foreground);
    padding:20px 16px 90px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:420px;margin:0 auto;}
  header{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
  .logo{
    width:40px;height:40px;border-radius:12px;background:var(--blue);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;
    box-shadow:var(--shadow);
  }
  header h1{font-size:20px;margin:0;font-weight:700;}
  header small{color:var(--muted-foreground);display:block;font-size:14px;margin-top:2px;}

  .section-title{
    font-size:13px;font-weight:700;color:var(--muted-foreground);
    margin:0 2px 12px;text-transform:uppercase;letter-spacing:.06em;
  }
  .card{
    background:var(--card);border-radius:18px;padding:16px;margin-bottom:20px;box-shadow:var(--shadow);
  }
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px;}
  label:first-child{margin-top:0;}
  input, select, textarea{
    width:100%;padding:12px;border:1px solid #e4e8ed;border-radius:12px;font-size:15px;
    background:#f9fafc;color:var(--foreground);
  }
  textarea{resize:vertical;min-height:60px;}
  .btn{
    display:block;width:100%;border:none;border-radius:12px;padding:14px;
    font-weight:700;font-size:15px;cursor:pointer;margin-top:14px;
  }
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-danger{background:var(--coral-soft);color:var(--coral);}
  .msg{font-size:13px;margin-top:10px;padding:10px;border-radius:10px;}
  .msg-ok{background:var(--mint-soft);color:var(--mint);}
  .msg-err{background:var(--coral-soft);color:var(--coral);}

  .pending-item, .event-item{
    background:#f9fafc;border-radius:12px;padding:12px;margin-bottom:10px;
  }
  .pending-item .name, .event-item .title{font-weight:700;font-size:14px;}
  .pending-item .meta, .event-item .meta{font-size:12px;color:var(--muted-foreground);margin:4px 0 8px;}
  .group-buttons{display:flex;flex-wrap:wrap;gap:6px;}
  .group-buttons button{
    border:none;background:var(--blue-soft);color:var(--blue);border-radius:10px;
    padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;
  }
  .event-item .row-actions{display:flex;gap:8px;margin-top:8px;}
  .event-item .row-actions button{
    flex:1;border:none;border-radius:10px;padding:8px;font-size:12px;font-weight:700;cursor:pointer;
  }
  .empty{color:var(--muted-foreground);font-size:13px;text-align:center;padding:10px;}

  nav{
    position:fixed;bottom:14px;left:16px;right:16px;background:#fff;border-radius:18px;
    display:flex;justify-content:space-around;padding:10px 4px;max-width:388px;margin:0 auto;
    box-shadow:0 8px 24px rgba(16,36,62,.14);
  }
  nav a{
    font-size:10.5px;font-weight:600;color:var(--muted-foreground);text-align:center;
    padding:8px 3px;border-radius:12px;flex:1;text-decoration:none;
  }
  nav a.active{color:var(--blue);background:var(--blue-soft);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">П</div>
    <div>
      <h1>Пульс команды</h1>
      <small>Управление</small>
    </div>
  </header>

  <div id="noaccess" class="card" style="display:none;">
    <div class="empty">Этот раздел только для владельца и админов.</div>
  </div>

  <div id="content" style="display:none;">
    <div class="section-title">Новое событие</div>
    <div class="card">
      <label>Название</label>
      <input id="f-title" placeholder="Клуб 100"/>
      <label>Категория</label>
      <select id="f-category">
        <option value="клуб 100">Клуб 100</option>
        <option value="обучение">Обучение</option>
        <option value="эфир/марафон">Эфир/марафон</option>
        <option value="планёрка">Планёрка</option>
        <option value="акция">Акция</option>
        <option value="дедлайн">Дедлайн</option>
      </select>
      <label>Дата и время</label>
      <input id="f-datetime" type="datetime-local"/>
      <label>Группа</label>
      <select id="f-group">
        <option value="all">Все</option>
        <option value="Новички">Новички</option>
        <option value="Партнёры">Партнёры</option>
        <option value="Мастера">Мастера</option>
        <option value="Ключевые">Ключевые</option>
      </select>
      <label>Описание (необязательно)</label>
      <textarea id="f-description"></textarea>
      <label>Ссылка (необязательно)</label>
      <input id="f-link" placeholder="https://..."/>
      <label>Ответственный (необязательно)</label>
      <input id="f-responsible" placeholder="Сергей"/>
      <label>Фотография (необязательно)</label>
      <input id="f-image" type="file" accept="image/*"/>
      <img id="f-image-preview" style="display:none;width:100%;border-radius:12px;margin-top:8px;"/>
      <button class="btn btn-primary" id="btn-create">Добавить событие</button>
      <div id="create-msg"></div>
    </div>

    <div class="section-title">Новые без группы</div>
    <div class="card" id="pending-card">
      <div class="empty">Загрузка…</div>
    </div>

    <div class="section-title">Ближайшие события</div>
    <div class="card" id="events-card">
      <div class="empty">Загрузка…</div>
    </div>
  </div>
</div>

<nav>
  <a href="today.html">Сегодня</a>
  <a href="calendar.html">Календарь</a>
  <a href="team.html">Команда</a>
  <a href="settings.html">Настройки</a>
  <a href="manage.html" class="active">Управление</a>
</nav>

<script>
const API = 'https://pulskomandy.duckdns.org';
const tg = window.Telegram && window.Telegram.WebApp;
if(tg) tg.ready();
const initData = (tg && tg.initData) || localStorage.getItem('tg_init_data') || '';
const GROUPS = ['Новички', 'Партнёры', 'Мастера', 'Ключевые'];

function showMsg(el, text, ok){
  el.innerHTML = `<div class="msg ${ok ? 'msg-ok' : 'msg-err'}">${text}</div>`;
}

function toApiDate(local){
  // "2026-09-01T19:00" -> "2026-09-01 19:00"
  return local.replace('T', ' ');
}

function readFileAsDataUrl(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById('f-image').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  const preview = document.getElementById('f-image-preview');
  if(!file){ preview.style.display = 'none'; return; }
  const dataUrl = await readFileAsDataUrl(file);
  preview.src = dataUrl;
  preview.style.display = 'block';
});

async function loadPending(){
  const card = document.getElementById('pending-card');
  try{
    const res = await fetch(`${API}/api/admin/pending?initData=${encodeURIComponent(initData)}`, {cache:'no-store'});
    const rows = await res.json();
    if(!res.ok){ card.innerHTML = '<div class="empty">Нет доступа</div>'; return; }
    if(!rows.length){ card.innerHTML = '<div class="empty">Все уже в группах</div>'; return; }
    card.innerHTML = rows.map(u => `
      <div class="pending-item">
        <div class="name">${u.name || 'Без имени'}</div>
        <div class="meta">telegram_id ${u.telegram_id} · с ${u.created_at}</div>
        <div class="group-buttons" data-id="${u.telegram_id}">
          ${GROUPS.map(g => `<button data-group="${g}">${g}</button>`).join('')}
        </div>
      </div>
    `).join('');
    card.querySelectorAll('.group-buttons button').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = Number(btn.parentElement.dataset.id);
        const group = btn.dataset.group;
        btn.disabled = true;
        const res = await fetch(`${API}/api/admin/setgroup`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({initData, telegram_id: id, group})
        });
        if(res.ok){ loadPending(); } else { btn.disabled = false; alert('Не получилось, попробуй ещё раз'); }
      });
    });
  }catch(e){
    card.innerHTML = '<div class="empty">Ошибка загрузки</div>';
  }
}

async function loadEvents(){
  const card = document.getElementById('events-card');
  try{
    const res = await fetch(`${API}/api/admin/events?initData=${encodeURIComponent(initData)}`, {cache:'no-store'});
    const rows = await res.json();
    if(!res.ok){ card.innerHTML = '<div class="empty">Нет доступа</div>'; return; }
    if(!rows.length){ card.innerHTML = '<div class="empty">Событий нет</div>'; return; }
    card.innerHTML = rows.map(ev => `
      <div class="event-item" data-id="${ev.id}">
        ${ev.image_url ? `<img src="${ev.image_url}" style="width:100%;border-radius:10px;margin-bottom:8px;">` : ''}
        <div class="title">${ev.title}</div>
        <div class="meta">${ev.event_dt} · ${ev.category || ''} · ${ev.group_name}</div>
        <div class="row-actions">
          <button class="btn-edit" style="background:var(--blue-soft);color:var(--blue);">Название</button>
          <button class="btn-desc" style="background:var(--blue-soft);color:var(--blue);">Описание</button>
          <button class="btn-photo" style="background:var(--blue-soft);color:var(--blue);">Фото</button>
          <button class="btn-del" style="background:var(--coral-soft);color:var(--coral);">Удалить</button>
        </div>
        <input type="file" accept="image/*" class="photo-input" style="display:none;">
      </div>
    `).join('');
    card.querySelectorAll('.event-item').forEach(item => {
      const id = item.dataset.id;
      item.querySelector('.btn-edit').addEventListener('click', async () => {
        const value = prompt('Новое название события:');
        if(value === null) return;
        await fetch(`${API}/api/admin/events/${id}/update`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({initData, field:'title', value})
        });
        loadEvents();
      });
      item.querySelector('.btn-desc').addEventListener('click', async () => {
        const value = prompt('Новое описание события:');
        if(value === null) return;
        await fetch(`${API}/api/admin/events/${id}/update`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({initData, field:'description', value})
        });
        loadEvents();
      });
      item.querySelector('.btn-photo').addEventListener('click', () => {
        item.querySelector('.photo-input').click();
      });
      item.querySelector('.photo-input').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const value = await readFileAsDataUrl(file);
        await fetch(`${API}/api/admin/events/${id}/update`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({initData, field:'image_url', value})
        });
        loadEvents();
      });
      item.querySelector('.btn-del').addEventListener('click', async () => {
        if(!confirm('Точно удалить событие?')) return;
        await fetch(`${API}/api/admin/events/${id}/delete`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({initData})
        });
        loadEvents();
      });
    });
  }catch(e){
    card.innerHTML = '<div class="empty">Ошибка загрузки</div>';
  }
}

document.getElementById('btn-create').addEventListener('click', async () => {
  const msgEl = document.getElementById('create-msg');
  const title = document.getElementById('f-title').value.trim();
  const category = document.getElementById('f-category').value;
  const dt = document.getElementById('f-datetime').value;
  const group_name = document.getElementById('f-group').value;
  const description = document.getElementById('f-description').value.trim();
  const link = document.getElementById('f-link').value.trim();
  const responsible = document.getElementById('f-responsible').value.trim();
  if(!title || !dt){
    showMsg(msgEl, 'Заполни название и дату', false);
    return;
  }
  const imageFile = document.getElementById('f-image').files[0];
  const image_data_url = imageFile ? await readFileAsDataUrl(imageFile) : null;
  const res = await fetch(`${API}/api/admin/events/create`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      initData, title, category, event_dt: toApiDate(dt), group_name,
      description, link, responsible, image_data_url
    })
  });
  const data = await res.json();
  if(res.ok){
    showMsg(msgEl, 'Событие добавлено!', true);
    document.getElementById('f-title').value = '';
    document.getElementById('f-description').value = '';
    document.getElementById('f-link').value = '';
    document.getElementById('f-responsible').value = '';
    document.getElementById('f-image').value = '';
    document.getElementById('f-image-preview').style.display = 'none';
    loadEvents();
  } else {
    showMsg(msgEl, data.error || 'Ошибка', false);
  }
});

if(!initData){
  document.getElementById('noaccess').style.display = 'block';
  document.getElementById('noaccess').querySelector('.empty').textContent =
    'Открой это через кнопку в Telegram-боте.';
} else {
  fetch(`${API}/api/whoami?initData=${encodeURIComponent(initData)}`, {cache:'no-store'})
    .then(r => r.json())
    .then(me => {
      if(me && (me.role === 'owner' || me.role === 'admin')){
        document.getElementById('content').style.display = 'block';
        loadPending();
        loadEvents();
      } else {
        document.getElementById('noaccess').style.display = 'block';
      }
    })
    .catch(() => {
      document.getElementById('noaccess').style.display = 'block';
    });
}
</script>
</body>
</html>
