<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Пульс команды — Календарь</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --blue:#4f7df5;
    --blue-soft:#eef2ff;
    --background:#eef1f8;
    --card:#ffffff;
    --foreground:#152033;
    --muted-foreground:#7c8698;
    --navy:#10243e;
    --mint:#3f9d81;
    --mint-soft:#e6f6f0;
    --coral:#e35f3f;
    --coral-soft:#fde9e2;
    --violet:#7c5fc4;
    --violet-soft:#efe9fb;
    --amber:#b9791b;
    --amber-soft:#fcefd7;
    --shadow: 0 2px 10px rgba(16,36,62,.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--background);
    color:var(--foreground);
    padding:20px 16px 90px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:420px;margin:0 auto;}
  header{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
  .logo{
    width:40px;height:40px;border-radius:12px;overflow:hidden;flex:0 0 auto;
    box-shadow:var(--shadow);
  }
  .logo img{width:100%;height:100%;object-fit:cover;display:block;}
  header h1{font-size:20px;margin:0;font-weight:700;}
  header small{color:var(--muted-foreground);display:block;font-size:14px;margin-top:2px;}

  .month-switch{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--card);border-radius:16px;padding:12px 16px;margin-bottom:16px;
    box-shadow:var(--shadow);
  }
  .month-switch button{
    border:none;background:var(--blue-soft);color:var(--blue);width:32px;height:32px;
    border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;
  }
  .month-switch .label{font-weight:700;font-size:15px;text-transform:capitalize;}

  .grid-card{
    background:var(--card);border-radius:18px;padding:14px;margin-bottom:20px;
    box-shadow:var(--shadow);
  }
  .weekdays, .days{
    display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;
  }
  .weekdays div{font-size:11px;font-weight:700;color:var(--muted-foreground);padding-bottom:8px;}
  .days .cell{
    position:relative;height:40px;display:flex;align-items:center;justify-content:center;
    font-size:14px;border-radius:10px;cursor:pointer;
  }
  .days .cell.muted{color:#c4cbd8;}
  .days .cell.today{background:linear-gradient(135deg,#5b86ff,#2f49c9);color:#fff;font-weight:700;}
  .days .cell.selected:not(.today){background:var(--blue-soft);color:var(--blue);font-weight:700;}
  .days .cell .dot{
    position:absolute;bottom:5px;left:50%;transform:translateX(-50%);
    width:5px;height:5px;border-radius:50%;background:var(--blue);
  }
  .days .cell.today .dot{background:#fff;}

  .section-title{
    font-size:13px;font-weight:700;color:var(--muted-foreground);
    margin:0 2px 14px;text-transform:uppercase;letter-spacing:.06em;
  }

  .card-wrap{
    background:var(--card);border-radius:18px;margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden;
  }
  .card{
    padding:16px;display:flex;gap:14px;align-items:center;cursor:pointer;
  }
  .details{display:none;padding:0 16px 16px;border-top:1px solid #f0f2f7;}
  .details.open{display:block;padding-top:14px;}
  .details img{width:100%;border-radius:12px;margin-bottom:12px;}
  .details .row{font-size:14px;margin-bottom:8px;color:var(--foreground);white-space:pre-line;line-height:1.5;}
  .details .row.desc{font-size:16px;line-height:1.6;margin-bottom:12px;}
  .details .row b{color:var(--muted-foreground);font-weight:600;}
  .details a{color:var(--blue);word-break:break-all;}
  .badge{
    width:50px;height:50px;border-radius:14px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-size:22px;
  }
  .b-club{background:var(--blue-soft);color:var(--blue);}
  .b-study{background:var(--mint-soft);color:var(--mint);}
  .b-live{background:var(--coral-soft);color:var(--coral);}
  .b-default{background:var(--violet-soft);color:var(--violet);}
  .b-event{background:var(--amber-soft);color:var(--amber);}

  .card .info{flex:1;min-width:0;}
  .card .title{
    font-weight:800;font-size:15px;line-height:1.3;
    text-transform:uppercase;letter-spacing:.02em;
    overflow-wrap:anywhere;
  }
  .card .meta{font-size:13px;color:var(--muted-foreground);margin-top:4px;}
  .card .cat-pill{
    display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;
    border-radius:20px;margin-top:7px;
  }
  .cat-club{background:var(--blue-soft);color:var(--blue);}
  .cat-study{background:var(--mint-soft);color:var(--mint);}
  .cat-live{background:var(--coral-soft);color:var(--coral);}
  .cat-default{background:var(--violet-soft);color:var(--violet);}
  .cat-event{background:var(--amber-soft);color:var(--amber);}

  .empty{color:var(--muted-foreground);font-size:14px;padding:20px 4px;text-align:center;}

  nav{
    position:fixed;bottom:14px;left:16px;right:16px;
    background:#fff;border-radius:18px;
    display:flex;justify-content:space-around;padding:10px 4px;
    max-width:388px;margin:0 auto;
    box-shadow:0 8px 24px rgba(16,36,62,.14);
  }
  nav a{
    font-size:10.5px;font-weight:600;color:var(--muted-foreground);text-align:center;
    padding:8px 3px;border-radius:12px;flex:1;text-decoration:none;
  }
  nav a.active{color:#fff;background:var(--blue);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><img src="logo.jpg" alt="Пульс команды"></div>
    <div>
      <h1>Пульс команды</h1>
      <small>Календарь событий</small>
    </div>
  </header>

  <div class="month-switch">
    <button id="prev">‹</button>
    <div class="label" id="month-label">—</div>
    <button id="next">›</button>
  </div>

  <div class="grid-card">
    <div class="weekdays">
      <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
    </div>
    <div class="days" id="days"></div>
  </div>

  <div class="section-title" id="list-title">События</div>
  <div id="list"></div>
</div>

<nav>
  <a href="today.html">Сегодня</a>
  <a href="calendar.html" class="active">Календарь</a>
  <a href="team.html">Команда</a>
  <a href="settings.html">Настройки</a>
  <a href="manage.html">Управление</a>
</nav>

<script>
const CATEGORY_ICON = {
  'клуб 100': {cls:'b-club', cat:'cat-club', icon:'💯'},
  'обучение': {cls:'b-study', cat:'cat-study', icon:'🎓'},
  'эфир/марафон': {cls:'b-live', cat:'cat-live', icon:'🔴'},
  'планёрка': {cls:'b-default', cat:'cat-default', icon:'🗓'},
  'акция': {cls:'b-default', cat:'cat-default', icon:'🎉'},
  'дедлайн': {cls:'b-default', cat:'cat-default', icon:'⏰'},
  'мероприятие': {cls:'b-event', cat:'cat-event', icon:'🌍'},
  'клиентское мероприятие': {cls:'b-event', cat:'cat-event', icon:'🤝'},
};
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTH_NAMES = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];

function fmtDate(dtStr){
  const [datePart, timePart] = dtStr.split(' ');
  const [y,m,d] = datePart.split('-');
  return `${parseInt(d)} ${MONTHS[parseInt(m)-1]} · ${timePart}`;
}

function metaLine(ev){
  const [datePart] = ev.event_dt.split(' ');
  const [y,m,d] = datePart.split('-');
  const end = ev.event_end ? ev.event_end.slice(0,10) : '';
  if(end && end !== datePart){
    const [ey,em,ed] = end.split('-');
    const tail = ev.category === 'мероприятие' ? ' · весь день' : '';
    return `${parseInt(d)} ${MONTHS[parseInt(m)-1]} – ${parseInt(ed)} ${MONTHS[parseInt(em)-1]}${tail}`;
  }
  if(ev.category === 'мероприятие'){
    return `${parseInt(d)} ${MONTHS[parseInt(m)-1]} · весь день`;
  }
  return fmtDate(ev.event_dt);
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function formatText(s){
  return escapeHtml(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}

let events = [];
let view = new Date();
view.setDate(1);
let selectedKey = null;

function dateKey(y,m,d){
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function render(){
  const y = view.getFullYear(), m = view.getMonth();
  document.getElementById('month-label').textContent = `${MONTH_NAMES[m]} ${y}`;

  const eventsByDay = {};
  events.forEach(ev => {
    const start = ev.event_dt.split(' ')[0];
    const end = ev.event_end ? ev.event_end.slice(0,10) : start;
    const cur = new Date(start + 'T00:00:00');
    const last = new Date((end >= start ? end : start) + 'T00:00:00');
    let guard = 0;
    while(cur <= last && guard < 120){
      const key = cur.toISOString().slice(0,10);
      (eventsByDay[key] = eventsByDay[key] || []).push(ev);
      cur.setDate(cur.getDate() + 1);
      guard++;
    }
  });

  const first = new Date(y, m, 1);
  const startOffset = (first.getDay() + 6) % 7; // Monday = 0
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const todayKey = new Date().toISOString().slice(0,10);

  const daysEl = document.getElementById('days');
  daysEl.innerHTML = '';
  for(let i=0;i<startOffset;i++){
    daysEl.innerHTML += '<div class="cell muted"></div>';
  }
  for(let d=1; d<=daysInMonth; d++){
    const key = dateKey(y,m,d);
    const has = !!eventsByDay[key];
    const isToday = key === todayKey;
    const isSelected = key === selectedKey;
    const cls = ['cell'];
    if(isToday) cls.push('today');
    if(isSelected) cls.push('selected');
    daysEl.innerHTML += `<div class="${cls.join(' ')}" data-key="${key}">${d}${has?'<span class="dot"></span>':''}</div>`;
  }

  document.querySelectorAll('.days .cell[data-key]').forEach(cell => {
    cell.addEventListener('click', () => {
      selectedKey = cell.dataset.key === selectedKey ? null : cell.dataset.key;
      render();
    });
  });

  const list = document.getElementById('list');
  const title = document.getElementById('list-title');
  let shown;
  if(selectedKey){
    shown = eventsByDay[selectedKey] || [];
    title.textContent = 'События в этот день';
  } else {
    const ym = `${y}-${String(m+1).padStart(2,'0')}`;
    shown = events.filter(ev =>
      ev.event_dt.slice(0,7) === ym ||
      (ev.event_end && ev.event_end.slice(0,7) === ym) ||
      (ev.event_end && ev.event_dt.slice(0,7) < ym && ev.event_end.slice(0,7) > ym)
    );
    title.textContent = 'Все события месяца';
  }

  list.innerHTML = '';
  if(!shown.length){
    list.innerHTML = '<div class="empty">Событий не найдено</div>';
    return;
  }
  shown.forEach(ev => {
    const meta = CATEGORY_ICON[ev.category] || CATEGORY_ICON['планёрка'];
    const wrap = document.createElement('div');
    wrap.className = 'card-wrap';
    const badgeHtml = ev.image_url
      ? `<div class="badge ${meta.cls}" style="position:relative;overflow:hidden;padding:0;">
           <span>${meta.icon}</span>
           <img src="${ev.image_url}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" onerror="this.remove()">
         </div>`
      : `<div class="badge ${meta.cls}">${meta.icon}</div>`;
    const detailRows = [];
    if(ev.description) detailRows.push(`<div class="row desc"><b>Описание:</b><br>${formatText(ev.description)}</div>`);
    if(ev.link) detailRows.push(`<div class="row"><b>Ссылка:</b> <a href="${ev.link}" target="_blank">${ev.link}</a></div>`);
    if(ev.responsible) detailRows.push(`<div class="row"><b>Ответственный:</b> ${ev.responsible}</div>`);
    detailRows.push(`<div class="row"><b>Группа:</b> ${ev.group_name === 'all' ? 'все' : ev.group_name}</div>`);
    wrap.innerHTML = `
      <div class="card">
        ${badgeHtml}
        <div class="info">
          <div class="title">${ev.title}</div>
          <div class="meta">${metaLine(ev)}</div>
          <span class="cat-pill ${meta.cat}">${ev.category || ''}</span>
        </div>
      </div>
      <div class="details">
        ${ev.image_url ? `<img src="${ev.image_url}" onerror="this.remove()">` : ''}
        ${detailRows.join('')}
      </div>
    `;
    wrap.querySelector('.card').addEventListener('click', () => {
      wrap.querySelector('.details').classList.toggle('open');
    });
    list.appendChild(wrap);
  });
}

document.getElementById('prev').addEventListener('click', () => {
  view.setMonth(view.getMonth()-1);
  selectedKey = null;
  render();
});
document.getElementById('next').addEventListener('click', () => {
  view.setMonth(view.getMonth()+1);
  selectedKey = null;
  render();
});

const tg = window.Telegram && window.Telegram.WebApp;
const initData = (tg && tg.initData) || localStorage.getItem('tg_init_data') || '';
const qsParam = initData ? '?initData=' + encodeURIComponent(initData) : '';
const API = 'https://pulskomandy.duckdns.org';

// Показываем только актуальное — текущие и будущие события.
// Прошедшие в календарь не тянем, а старые записи чистит cleanup.py по крону.
fetch(`${API}/api/events${qsParam}`, {cache:'no-store'})
  .then(r => r.json())
  .then(list => {
    events = (list || []).sort((a, b) =>
      a.event_dt < b.event_dt ? -1 : a.event_dt > b.event_dt ? 1 : 0
    );
    render();
  })
  .catch(() => { document.getElementById('list').innerHTML = '<div class="empty">Нет данных</div>'; });
</script>
</body>
</html>
